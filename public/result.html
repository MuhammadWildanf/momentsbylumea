<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Special Moment - lumea</title>
    <style>
        @font-face {
            font-family: 'Luxurious Script';
            src: url('/fonts/LuxuriousScript-Regular.ttf') format('truetype');
            font-weight: normal;
        }

        @font-face {
            font-family: 'Aref Ruqaa';
            src: url('/fonts/ArefRuqaa-Regular.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Aref Ruqaa';
            src: url('/fonts/ArefRuqaa-Bold.ttf') format('truetype');
            font-weight: 700;
        }

        :root {
            --accent: #c5a059;
            --gold-gradient: linear-gradient(135deg, #c5a059 0%, #d4af37 50%, #b38b4d 100%);
            --bg-dark: #1a0f0a;
            --bg-1: #1a0f0a;
            --bg-2: #100a06;
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Aref Ruqaa', serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            background-image: radial-gradient(circle at center, var(--bg-1) 0%, var(--bg-2) 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: rgba(20, 15, 10, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            margin-top: 20px;
        }

        .title {
            font-family: 'Luxurious Script', cursive;
            font-size: 60px;
            color: #F0E5C7;
            margin-bottom: 10px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 18px;
            color: #F0E5C7;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
            opacity: 0.9;
        }

        .media-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .media-card {
            flex: 1;
            min-width: 300px;
            max-width: 400px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid rgba(197, 160, 89, 0.5);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .media-card video,
        .media-card img {
            width: 100%;
            display: block;
            aspect-ratio: 9/16;
            object-fit: cover;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 30px;
            background: var(--btn-bg, #721c24);
            color: var(--btn-text-color, #ffffff);
            border: 1px solid rgba(197, 160, 89, 0.4);
            /* Elegant subtle gold border */
            border-radius: 50px;
            font-family: 'Aref Ruqaa', serif;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 15px;
            margin-bottom: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .loading {
            font-size: 24px;
            color: var(--accent);
            margin-top: 50px;
        }

        .error-state {
            color: #ef4444;
            font-size: 20px;
            margin-top: 50px;
            display: none;
        }

        .footer-text {
            margin-top: 50px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Responsive Design untuk Mobile */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            .container {
                padding: 30px 15px;
                border-radius: 15px;
                margin-top: 10px;
            }

            .title {
                font-size: 42px;
            }

            .subtitle {
                font-size: 15px;
                margin-bottom: 25px;
            }

            .media-grid {
                gap: 20px;
            }

            .media-card {
                min-width: 100%;
                border-radius: 12px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <div id="loading" class="loading">Loading your memories... ✨</div>

    <div id="error" class="error-state">
        Sorry, your session was not found or has expired.
    </div>

    <div id="content" class="container" style="display: none;">
        <!-- Centered Lumea Logo or Title -->
        <div style="text-align: center; margin-bottom: 25px;">
            <img id="logoElement" src="/logo-lumea.png" alt="Lumea Logo"
                style="height: 50px; width: auto; object-fit: contain; pointer-events: none;">
            <div id="titleElement" class="scribble-title" style="display: none; font-size: min(8vh, 80px); font-family: var(--title-font-dyn, 'Luxurious Script', cursive); color: var(--title-color, white); text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); font-weight: 400; margin-bottom: 20px; line-height: 1.1; margin-top: 10px;"></div>
        </div>


        <div class="media-grid">
            <div class="media-card" id="videoContainer" style="display: none;">
                <video id="videoElement" autoplay loop muted playsinline controls></video>
                <div style="padding: 15px; background: rgba(20, 15, 10, 0.95);">
                    <a id="videoDownload" href="#" target="_blank" class="btn" style="width: 100%;">🎬 Save Your
                        Video</a>
                </div>
            </div>

            <div class="media-card" id="photoContainer" style="display: none;">
                <img id="photoElement" src="" alt="ScribbleBooth Photo">
                <div style="padding: 15px; background: rgba(20, 15, 10, 0.95);">
                    <a id="photoDownload" href="#" target="_blank" class="btn" style="width: 100%;">📸 Save Your
                        Photo</a>
                </div>
            </div>
        </div>

        <p class="footer-text">
            <strong>Here’s to the moments you’ll always look back on - @momentsbylumea</strong>
        </p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('id');
            const eventId = urlParams.get('event') || '';

            // Default fallbacks in English
            window.resultErrorTextVal = "Sorry, your session was not found or has expired.";
            window.resultProcessingTextVal = `Processing your video & photo... please wait a moment. ✨<br><small style="font-size: 14px; opacity: 0.8; display: block; margin-top: 10px;">Rendering process usually takes 10-15 seconds.</small>`;

            // Load theme & text configuration immediately in parallel
            let themePromise = fetch('/api/config' + (eventId ? `?eventId=${eventId}` : ''), { cache: 'no-store' })
                .then(res => res.json())
                .then(configData => {
                    if (configData.bgColor1) {
                        document.documentElement.style.setProperty('--bg-1', configData.bgColor1);
                    }
                    if (configData.bgColor2) {
                        document.documentElement.style.setProperty('--bg-2', configData.bgColor2);
                    }
                    if (configData.bgImageUrl && configData.bgImageUrl !== 'none' && configData.bgImageUrl !== 'Default') {
                        document.body.style.backgroundImage = `url('${configData.bgImageUrl}')`;
                    } else {
                        document.body.style.backgroundImage = 'radial-gradient(circle at center, var(--bg-1, #1a0f0a) 0%, var(--bg-2, #100a06) 100%)';
                    }
                    if (configData.accentColor) {
                        document.documentElement.style.setProperty('--accent', configData.accentColor);
                    }
                    if (configData.resultBtnBgColor) {
                        document.documentElement.style.setProperty('--btn-bg', configData.resultBtnBgColor);
                    }
                    if (configData.resultBtnTextColor) {
                        document.documentElement.style.setProperty('--btn-text-color', configData.resultBtnTextColor);
                    }
                    // Check idleHeadMode (Title vs Logo)
                    const logoEl = document.getElementById('logoElement');
                    const titleEl = document.getElementById('titleElement');

                    if (configData.idleHeadMode === 'logo' && configData.logoUrl) {
                        if (logoEl) {
                            logoEl.src = configData.logoUrl;
                            logoEl.style.display = 'inline-block';
                        }
                        if (titleEl) titleEl.style.display = 'none';
                    } else {
                        if (logoEl) logoEl.style.display = 'none';
                        if (titleEl && configData.title) {
                            const formatTitleText = (title) => {
                                if (!title) return '';
                                const match = title.match(/(?:<[^>]+>)*\s+(and|dan|bersama)\s+(?:<[^>]+>)*/i) || 
                                              title.match(/(?:<[^>]+>)*\s*(&|\+)\s*(?:<[^>]+>)*/);
                                if (match) {
                                    const connectorHtml = match[0];
                                    const parts = title.split(connectorHtml);
                                    return '<span>' + parts[0].trim() + '</span> <span class="title-amp" style="font-family: \'Aref Ruqaa\', serif; font-size: 0.5em; vertical-align: middle; margin: 0 10px; opacity: 0.8;">' + connectorHtml.trim() + '</span> <span>' + parts.slice(1).join(connectorHtml).trim() + '</span>';
                                }
                                return '<span>' + title + '</span>';
                            };
                            titleEl.innerHTML = formatTitleText(configData.title);
                            titleEl.style.display = 'block';
                            if (configData.titleColor) titleEl.style.color = configData.titleColor;
                        }
                    }

                    // Apply custom fonts
                    const isDirectFont = configData.fontUrl && /\.(ttf|otf|woff|woff2)(\?.*)?$/i.test(configData.fontUrl);
                    if (configData.fontUrl && !isDirectFont) {
                        let link = document.getElementById('dynamic-font');
                        if (!link) {
                            link = document.createElement('link');
                            link.id = 'dynamic-font';
                            link.rel = 'stylesheet';
                            document.head.appendChild(link);
                        }
                        link.href = configData.fontUrl;
                    }
                    if (configData.fontFamily || configData.titleFontFamily) {
                        let styleParams = document.getElementById('dynamic-font-styles');
                        if (!styleParams) {
                            styleParams = document.createElement('style');
                            styleParams.id = 'dynamic-font-styles';
                            document.head.appendChild(styleParams);
                        }

                        let fontFaceRule = '';
                        if (isDirectFont) {
                            let format = 'truetype';
                            if (configData.fontUrl.toLowerCase().includes('.otf')) format = 'opentype';
                            else if (configData.fontUrl.toLowerCase().includes('.woff2')) format = 'woff2';
                            else if (configData.fontUrl.toLowerCase().includes('.woff')) format = 'woff';

                            fontFaceRule = `
                                @font-face {
                                    font-family: ${configData.fontFamily || "'CustomUploadedFont'"};
                                    src: url("${configData.fontUrl}") format("${format}");
                                    font-weight: normal;
                                    font-style: normal;
                                }
                            `;
                        }

                        styleParams.innerHTML = `
                            ${fontFaceRule}
                            :root { 
                                --title-font-dyn: ${configData.titleFontFamily || configData.fontFamily || "'Luxurious Script', cursive"}; 
                                --body-font-dyn: ${configData.fontFamily || "'Aref Ruqaa', serif"};
                            }
                            body, button, .btn, .footer-text, .loading, .error-state {
                                font-family: var(--body-font-dyn) !important;
                            }
                            .title {
                                font-family: var(--title-font-dyn) !important;
                            }
                        `;
                    }

                    // Apply config texts
                    const loadingTextVal = configData.resultLoadingText || "Loading your memories... ✨";
                    const errorTextVal = configData.resultErrorText || "Sorry, your session was not found or has expired.";
                    const saveVideoTextVal = configData.resultSaveVideoText || "🎬 Save Your Video";
                    const savePhotoTextVal = configData.resultSavePhotoText || "📸 Save Your Photo";
                    const resultFooterTextVal = configData.resultFooterText || "Here’s to the moments you’ll always look back on - @momentsbylumea";

                    window.resultErrorTextVal = errorTextVal;
                    window.resultProcessingTextVal = configData.resultProcessingText || `Processing your video & photo... please wait a moment. ✨<br><small style="font-size: 14px; opacity: 0.8; display: block; margin-top: 10px;">Rendering process usually takes 10-15 seconds.</small>`;

                    const loadingEl = document.getElementById('loading');
                    if (loadingEl && loadingEl.innerHTML.indexOf('Processing') === -1 && loadingEl.innerHTML.indexOf('processing') === -1) {
                        loadingEl.innerHTML = loadingTextVal;
                    }
                    const errorEl = document.getElementById('error');
                    if (errorEl) {
                        errorEl.innerHTML = errorTextVal;
                    }
                    const videoDownloadEl = document.getElementById('videoDownload');
                    if (videoDownloadEl) {
                        videoDownloadEl.innerHTML = saveVideoTextVal;
                    }
                    const photoDownloadEl = document.getElementById('photoDownload');
                    if (photoDownloadEl) {
                        photoDownloadEl.innerHTML = savePhotoTextVal;
                    }
                    const footerEl = document.querySelector('.footer-text');
                    if (footerEl) {
                        footerEl.innerHTML = `<strong>${resultFooterTextVal}</strong>`;
                        if (configData.galleryFooterTextColor) {
                            footerEl.style.color = configData.galleryFooterTextColor;
                        }
                    }
                }).catch(e => console.warn("Failed to load theme:", e));

            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const contentEl = document.getElementById('content');

            if (!sessionId) {
                loadingEl.style.display = 'none';
                errorEl.style.display = 'block';
                return;
            }

            let attempts = 0;
            const maxAttempts = 30; // 30 attempts * 3 seconds = 90 seconds max polling time

            async function checkResult() {
                try {
                    const response = await fetch(`/api/result/${sessionId}`);
                    
                    if (response.status === 404) {
                        attempts++;
                        if (attempts >= maxAttempts) {
                            loadingEl.style.display = 'none';
                            errorEl.innerHTML = window.resultErrorTextVal;
                            errorEl.style.display = 'block';
                        } else {
                            loadingEl.innerHTML = window.resultProcessingTextVal;
                            setTimeout(checkResult, 3000);
                        }
                        return;
                    }

                    const result = await response.json();
                    loadingEl.style.display = 'none';

                    if (result.status === 'success' && result.data) {
                        contentEl.style.display = 'block';
                        
                        if (result.data.videoLink) {
                            const vContainer = document.getElementById('videoContainer');
                            vContainer.style.display = 'block';
                            document.getElementById('videoElement').src = result.data.videoLink;
                            document.getElementById('videoDownload').href = `/api/download?url=${encodeURIComponent(result.data.videoLink)}&name=Video-${result.data.name.replace(/\s+/g, '-')}.mp4`;
                        }

                        if (result.data.photoLink) {
                            const pContainer = document.getElementById('photoContainer');
                            pContainer.style.display = 'block';
                            document.getElementById('photoElement').src = result.data.photoLink;
                            document.getElementById('photoDownload').href = `/api/download?url=${encodeURIComponent(result.data.photoLink)}&name=Photo-${result.data.name.replace(/\s+/g, '-')}.jpg`;
                        }
                    } else {
                        errorEl.style.display = 'block';
                    }
                } catch (err) {
                    console.error("Fetch error:", err);
                    attempts++;
                    if (attempts >= maxAttempts) {
                        loadingEl.style.display = 'none';
                        errorEl.style.display = 'block';
                    } else {
                        setTimeout(checkResult, 3000);
                    }
                }
            }

            checkResult();
        });
    </script>
</body>

</html>
